[package]
name = "telinha"
version = "0.1.0"
edition = "2021"
description = "Compartilhamento de tela simples via Cloudflare Tunnel"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossbeam-channel = "0.5.17"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
eframe = { version = "0.37.0", features = ["persistence"] }
fast_image_resize = "6.2.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
windows-capture = "2.0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
